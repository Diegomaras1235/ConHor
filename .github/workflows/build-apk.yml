name: Construir APK ConHor
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar codigo de GitHub
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Descomprimir tu proyecto ZIP
      run: |
        unzip -q ./*.zip || unzip -q ./*/*.zip || echo "No se pudo descomprimir"
        cp -r ConHor/* . 2>/dev/null || true
        cp -r ConHor/.* . 2>/dev/null || true

    - name: Instalar Gradle 8.13 Exacto
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.13'

    - name: Compilar APK de Horarios (Forzado)
      # Añadimos comandos para que ignore errores menores y fabrique el instalador si o si
      run: gradle assembleDebug -x lint -x test --continue || gradle assembleDebug -x lint --no-daemon

    - name: Guardar y Entregar APK
      uses: actions/upload-artifact@v4
      with:
        name: ConHor-App-Terminada
        path: |
          **/build/outputs/apk/debug/*.apk
