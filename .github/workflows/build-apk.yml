name: Compilar ConHor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar proyecto
        run: |
          unzip -q ConHor-1.2-proyecto.zip
          echo "Proyecto descomprimido:"
          ls -la ConHor
          
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar APK
        working-directory: ConHor
        run: |
          gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ConHor-APK
          path: ConHor/app/build/outputs/apk/debug/app-debug.apk
