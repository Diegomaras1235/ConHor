name: Construir APK ConHor
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar codigo de GitHub
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Descomprimir tu proyecto ZIP
      run: |
        unzip -q ./*.zip || unzip -q ./*/*.zip || echo "No se pudo descomprimir"
        cp -r ConHor/* . 2>/dev/null || true
        cp -r ConHor/.* . 2>/dev/null || true

    - name: Resetear Motor Gradle
      run: |
        # Borramos cualquier rastro congelado de las versiones fallidas
        rm -rf gradle .gradle gradlew gradlew.bat
        
        # Le pedimos a la nube que use su version estable por defecto
        gradle wrapper --gradle-version 8.7
        chmod +x gradlew

    - name: Compilar APK de Horarios
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Guardar y Entregar APK
      uses: actions/upload-artifact@v4
      with:
        name: ConHor-App-Terminada
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          ConHor/app/build/outputs/apk/debug/app-debug.apk
