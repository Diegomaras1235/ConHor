name: Construir APK ConHor
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar codigo
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Descomprimir Proyecto
      run: |
        unzip -q conhor-1-2-proyecto.zip
        # Movemos el contenido de ConHor a la raiz para que Gradle lo encuentre
        mv ConHor/* . 2>/dev/null || true
        mv ConHor/.* . 2>/dev/null || true

    - name: Configurar Gradle Wrapper
      run: |
        # Como el ZIP no incluye el comando gradlew ejecutable, lo generamos aqui
        gradle wrapper --gradle-version 8.0
        chmod +x gradlew

    - name: Compilar APK de Horarios
      run: ./gradlew assembleDebug

    - name: Guardar y Entregar APK
      uses: actions/upload-artifact@v4
      with:
        name: ConHor-App-Terminada
        path: app/build/outputs/apk/debug/app-debug.apk
