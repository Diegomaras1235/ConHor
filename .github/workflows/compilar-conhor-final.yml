name: Compilar ConHor Final
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar codigo de GitHub
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Descomprimir Proyecto en Ruta Correcta
      run: |
        # Descomprimimos de forma limpia
        unzip -q ./*.zip || unzip -q ./*/*.zip || echo "No se pudo descomprimir"
        
        # Si el ZIP creo una carpeta ConHor, movemos su contenido directamente a la raiz
        if [ -d "ConHor" ]; then
          cp -r ConHor/* . 2>/dev/null || true
          cp -r ConHor/.* . 2>/dev/null || true
          rm -rf ConHor
        fi

    - name: Instalar Gradle 8.13 Exacto
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.13'

    - name: Compilar APK de Horarios Final
      run: gradle assembleDebug --no-daemon

    - name: Guardar y Entregar APK
      uses: actions/upload-artifact@v4
      with:
        name: Aplicacion-ConHor-Instalable
        path: app/build/outputs/apk/debug/app-debug.apk
